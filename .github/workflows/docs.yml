name: Документация

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Установить locked-окружение документации
        run: uv sync --frozen --group docs
      - name: Строго собрать сайт
        run: uv run --no-sync mkdocs build --strict
