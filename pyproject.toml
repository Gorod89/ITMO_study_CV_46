[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "itmo-cv-coursekit"
version = "1.0.0"
description = "Инструменты воспроизводимости для курса ИТМО по компьютерному зрению"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pillow>=10.3,<13",
]

[project.optional-dependencies]
cv = [
    "matplotlib>=3.8,<4",
    "opencv-contrib-python-headless>=4.9,<5",
    "pandas>=2.2,<4",
    "scikit-image>=0.22,<0.26",
    "scikit-learn>=1.4,<1.9",
]
torch-cpu = [
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.7,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision>=0.22,<1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
deep-learning = [
    "accelerate>=1.2,<3",
    "albumentations>=1.4,<3",
    "segmentation-models-pytorch>=0.4,<0.6",
    "timm>=1.0,<2",
    "torchmetrics>=1.4,<2",
    "transformers>=4.48,<6",
]
retrieval = [
    "faiss-cpu>=1.9,<2",
]
inference = [
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.20,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
yolo = [
    "pyyaml>=6,<7",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7,<5",
    "pytest>=8.2,<10",
    "ruff>=0.8,<1",
]
notebooks = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "tqdm>=4.66,<5",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["coursekit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
